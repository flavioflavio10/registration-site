<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volleyball Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .events {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .event-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .event-card:hover {
      transform: translateY(-5px);
    }

    .event-card h2 {
      margin-bottom: 10px;
    }

    .event-card p {
      color: #666;
    }

    .back-btn {
      display: inline-block;
      margin-top: 30px;
      text-decoration: none;
      color: #1e90ff;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🏐 Upcoming Events</h1>

    <div class="events">
      <div class="event-card">
        <h2>Event 1</h2>
        <p>Open play volleyball session</p>
      </div>

      <div class="event-card">
        <h2>Event 2</h2>
        <p>Tournament-style games</p>
      </div>

      <div class="event-card">
        <h2>Event 3</h2>
        <p>Beginner-friendly clinic</p>
      </div>
    </div>

    <a href="index.html" class="back-btn">← Back to Home</a>
  </div>
</body>
</html>
