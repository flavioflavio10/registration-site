<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volleyball Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
    }

    /* NAV BAR (LOCKED HEIGHT) */
    .navbar {
      background: #040d6e;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      overflow: visible;
    }

    .nav-left,
    .nav-right {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* LOGO IMAGE */
    .logo-img {
      height: 100px;
      width: auto;
      display: block;
      margin-top: 15px;
    }

    /* NAV BUTTON STYLE */
    .nav-btn,
    .contact-btn {
      background: rgba(255,255,255,0.18);
      padding: 10px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .nav-btn:hover,
    .contact-btn:hover {
      background: rgba(255,255,255,0.28);
    }

    /* HERO BACKGROUND (like index.html) */
    .hero {
      min-height: calc(100vh - 100px); /* match navbar height */
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("hero.jpg") center/cover no-repeat;
      padding: 40px 20px;
    }

    /* PAGE CONTENT (on top of hero background) */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 34px 20px;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
    }

    h1 {
      text-align: center;
      margin: 0 0 30px;
      color: white;
    }

    .events {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
      justify-items: center;
    }

    /* ✅ Event card becomes a positioning wrapper (background + free-move items) */
    .event-card {
      position: relative;
      width: 100%;
      box-sizing: border-box;
      border-radius: 18px;
      overflow: hidden;
      min-height: 520px; /* adjust card height */
      transition: transform 0.2s;
    }

    .event-card:hover {
      transform: translateY(-5px);
    }

    /* ✅ Background layer (the "box") */
    .event-bg {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1;
    }

    /* ✅ Independent, movable title */
    .event-title {
      position: absolute;
      top: 110px;   /* move me */
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      margin: 0;
      font-size: 34px;
      z-index: 2;
    }

    /* ✅ Independent, movable description */
    .event-desc {
      position: absolute;
      top: 380px;   /* move me */
      left: 30px;   /* move me */
      right: 70px;  /* controls width */
      text-align: left;
      color: rgba(255,255,255,0.90);
      margin: 0;
      z-index: 2;
      line-height: 1.3;
      font-size: 14px;
    }

    /* ✅ Independent, movable button */
    .event-btn {
      position: absolute;
      bottom: 20px; /* move me */
      left: 70px;    /* move me */
      width: 160px;  /* button width */
      padding: 14px 18px;
      background: white;
      color: #1f3556;
      text-decoration: none;
      font-weight: bold;
      border-radius: 999px;
      text-align: center;
      z-index: 2;
      box-sizing: border-box;
    }

    .event-btn:hover {
      background: #f0f0f0;
    }

    .back-btn {
      display: inline-block;
      margin-top: 30px;
      text-decoration: none;
      color: white;
      font-weight: bold;
    }

    /* --- MOBILE FIXES (PUT THIS AT THE VERY BOTTOM) --- */
    @media (max-width: 700px) {
      .navbar {
        height: auto;
        padding: 12px 14px;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: wrap;
        overflow: visible;
      }

      .nav-left {
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .nav-right {
        width: 100%;
        justify-content: flex-start;
        margin-top: 6px;
      }

      .logo-img {
        height: 56px;
        margin-top: 0;
      }

      .nav-btn,
      .contact-btn {
        padding: 8px 12px;
        border-radius: 16px;
        font-size: 14px;
      }

      .hero {
        min-height: auto;
        padding: 30px 14px;
      }

      .container {
        padding: 26px 16px;
      }

      /* ✅ Optional mobile adjustments for positioned content */
      .event-card {
        min-height: 460px;
      }

      .event-title {
        top: 90px;
        font-size: 30px;
      }

      .event-desc {
        top: 290px;
        left: 30px;
        right: 30px;
        font-size: 16px;
      }

      .event-btn {
        left: 85px;
        bottom: 30px;
        width: 160px;
      }
    }
  </style>
</head>

<body>

  <!-- NAV BAR -->
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="logo.png" alt="Logo" class="logo-img" />
      </a>

      <a href="index.html" class="nav-btn">HOME</a>
      <a href="contact.html" class="contact-btn">ABOUT</a>
      <a href="rules.html" class="nav-btn">RULES</a>
    </div>
  </div>

  <!-- HERO BACKGROUND WRAP -->
  <div class="hero">
    <div class="container">
      <h1>🏐 Upcoming Events</h1>

      <div class="events">
        <div class="event-card">
          <div class="event-bg"></div>
          <h2 class="event-title">Event 1</h2>
          <p class="event-desc">
            SPRING FEST - M/F Doubles<br>
            Sat Mar 14th<br>
            Tournament | Enterprise Park
          </p>
          <a href="#" class="event-btn">View Event</a>
        </div>

        <div class="event-card">
          <div class="event-bg"></div>
          <h2 class="event-title">Event 2</h2>
          <p class="event-desc">Tournament-style games</p>
          <a href="#" class="event-btn">View Event</a>
        </div>

        <div class="event-card">
          <div class="event-bg"></div>
          <h2 class="event-title">Event 3</h2>
          <p class="event-desc">Beginner-friendly clinic</p>
          <a href="#" class="event-btn">View Event</a>
        </div>
      </div>

      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
  </div>

</body>
</html>
