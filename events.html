<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volleyball Events</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
    }

    /* NAV BAR (LOCKED HEIGHT) */
    .navbar {
      background: #040d6e;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      overflow: visible;
    }

    .nav-left,
    .nav-right {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* LOGO IMAGE */
    .logo-img {
      height: 100px;
      width: auto;
      display: block;
      margin-top: 15px;
    }

    /* NAV BUTTON STYLE */
    .nav-btn,
    .contact-btn {
      background: rgba(255,255,255,0.18);
      padding: 10px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .nav-btn:hover,
    .contact-btn:hover {
      background: rgba(255,255,255,0.28);
    }

    /* HERO BACKGROUND (like index.html) */
    .hero {
      min-height: calc(100vh - 100px); /* match navbar height */
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("hero.jpg") center/cover no-repeat;
      padding: 40px 20px;
    }

    /* PAGE CONTENT (on top of hero background) */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 34px 20px;
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    h1 {
      text-align: center;
      margin: 0 0 30px;
    }

    .events {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .event-card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    .event-card:hover {
      transform: translateY(-5px);
    }

    .event-card h2 {
      margin-bottom: 10px;
    }

    .event-card p {
      color: #666;
    }

    .back-btn {
      display: inline-block;
      margin-top: 30px;
      text-decoration: none;
      color: #1e90ff;
      font-weight: bold;
    }

    /* --- MOBILE FIXES (PUT THIS AT THE VERY BOTTOM) --- */
    @media (max-width: 700px) {
      .navbar {
        height: auto;
        padding: 12px 14px;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: wrap;
        overflow: visible;
      }

      .nav-left {
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .nav-right {
        width: 100%;
        justify-content: flex-start;
        margin-top: 6px;
      }

      .logo-img {
        height: 56px;
        margin-top: 0;
      }

      .nav-btn,
      .contact-btn {
        padding: 8px 12px;
        border-radius: 16px;
        font-size: 14px;
      }

      .hero {
        min-height: auto;
        padding: 30px 14px;
      }

      .container {
        padding: 26px 16px;
      }
    }
  </style>
</head>

<body>

  <!-- NAV BAR -->
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="logo.png" alt="Logo" class="logo-img" />
      </a>

      <a href="index.html" class="nav-btn">HOME</a>
      <a href="contact.html" class="contact-btn">ABOUT</a>
      <a href="rules.html" class="nav-btn">RULES</a>
    </div>
  </div>

  <!-- HERO BACKGROUND WRAP -->
  <div class="hero">
    <div class="container">
      <h1>🏐 Upcoming Events</h1>

      <div class="events">
        <div class="event-card">
          <h2>Event 1</h2>
          <p>Open play volleyball session</p>
        </div>

        <div class="event-card">
          <h2>Event 2</h2>
          <p>Tournament-style games</p>
        </div>

        <div class="event-card">
          <h2>Event 3</h2>
          <p>Beginner-friendly clinic</p>
        </div>
      </div>

      <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
  </div>

</body>
</html>
