<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>530Volleyball | Live Event</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* NAV BAR (LOCKED HEIGHT) */
    .navbar {
      background: #040d6e;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      overflow: visible;
    }

    .nav-left,
    .nav-right {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* LOGO IMAGE */
    .logo-img {
      height: 100px;
      width: auto;
      display: block;
      margin-top: 15px;
    }

    /* NAV BUTTON STYLE */
    .nav-btn,
    .contact-btn {
      background: rgba(255,255,255,0.18);
      padding: 10px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .nav-btn:hover,
    .contact-btn:hover {
      background: rgba(255,255,255,0.28);
    }

    /* Make LIVE EVENT stand out */
    .nav-btn.live-event {
      border: 2px solid #ff2d55;
      background: rgba(255,255,255,0.18);
      box-shadow: 0 0 0 rgba(255,45,85,0);
    }

    .nav-btn.live-event:hover {
      background: rgba(255,255,255,0.26);
      box-shadow: 0 0 0 4px rgba(255,45,85,0.18);
    }

    /* HERO (same background as index) */
    .hero {
      min-height: calc(100vh - 100px);
      background:
        linear-gradient(rgba(0,0,0,0.50), rgba(0,0,0,0.50)),
        url("hero.jpg") center/cover no-repeat;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 18px;
      box-sizing: border-box;
    }

    .hero-content {
      width: 100%;
      max-width: 980px;
    }

    .hero h1 {
      font-size: 36px;
      margin: 0 0 14px;
      letter-spacing: 1px;
      text-align: center;
    }

    .hero p.lead {
      font-size: 18px;
      line-height: 1.6;
      opacity: 0.95;
      text-align: center;
      max-width: 900px;
      margin: 0 auto 22px;
    }

    /* ---- LIVE EVENT STYLES ---- */
    :root{
      --border: rgba(0,0,0,0.12);
      --mutedDark: rgba(0,0,0,0.62);
      --shadow: 0 10px 30px rgba(0,0,0,0.18);
      --radius: 18px;
      --accent: #ff2d55;
    }

    /* MAIN CARD: NOW WHITE + BLACK TEXT */
    .live-card {
      background: #ffffff;
      color: #111827;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 22px;
      box-shadow: var(--shadow);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tab-btn {
      appearance: none;
      border: 2px solid rgba(0,0,0,0.14);
      background: rgba(0,0,0,0.02);
      color: #111827;
      font-weight: 800;
      padding: 10px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, opacity 160ms ease;
      white-space: nowrap;

      /* ✅ added so <a> looks exactly like a button */
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.26);
    }

    .tab-btn.active {
      background: #0b1220;
      color: white;
      border-color: #0b1220;
    }

    .tab-btn.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    /* Section Head */
    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.5px;
      color: #0b1220;
    }

    .section-note {
      margin: 6px 0 0 0;
      color: var(--mutedDark);
      font-size: 14px;
      line-height: 1.5;
      max-width: 560px;
    }

    /* Tournament Toggle */
    .toggle {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .toggle-btn {
      border: 2px solid rgba(0,0,0,0.14);
      background: rgba(0,0,0,0.02);
      color: #111827;
      font-weight: 900;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 160ms ease, transform 160ms ease, border-color 160ms ease;
      min-width: 120px;
      text-align: center;
      position: relative;
    }

    .toggle-btn:hover {
      transform: translateY(-1px);
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.26);
    }

    .toggle-btn.active {
      background: #ffffff;
      border-color: #0b1220;
      box-shadow: 0 10px 20px rgba(0,0,0,0.10);
    }

    .toggle-btn.active::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: -6px;
      height: 3px;
      border-radius: 999px;
      background: var(--accent);
    }

    /* Pool grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 10px;
    }

    /* POOL CARDS: WHITE + BLACK */
    .pool-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      background: #ffffff;
      box-shadow: 0 10px 18px rgba(0,0,0,0.10);
      display: flex;
      flex-direction: column;
      gap: 10px;
      color: #111827;
    }

    .pool-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pool-name {
      margin: 0;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.2px;
      color: #0b1220;
    }

    .pill {
      font-size: 12px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.12);
      color: rgba(0,0,0,0.62);
      background: rgba(0,0,0,0.03);
      white-space: nowrap;
    }

    .pool-desc {
      margin: 0;
      color: rgba(0,0,0,0.62);
      font-size: 14px;
      line-height: 1.5;
    }

    .pool-btn {
      margin-top: auto;
      display: inline-block;
      text-decoration: none;
      font-weight: 900;
      text-align: center;
      padding: 12px 14px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0.16);
      color: #0b1220;
      background: #ffffff;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .pool-btn:hover {
      transform: translateY(-1px);
      background: rgba(0,0,0,0.03);
      border-color: rgba(0,0,0,0.30);
    }

    /* Teams preview table */
    .teams-mini-wrap{
      margin-top: 8px;
      border: 1px solid rgba(0,0,0,0.10);
      border-radius: 16px;
      overflow: hidden;
      background: rgba(0,0,0,0.02);
    }

    .teams-mini{
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .teams-mini thead th{
      text-align: left;
      padding: 6px 12px;
      background: rgba(0,0,0,0.04);
      border-bottom: 1px solid rgba(0,0,0,0.10);
      color: rgba(0,0,0,0.72);
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    .teams-mini tbody td{
      padding: 6px 12px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      vertical-align: middle;
      color: #0b1220;
      line-height: 1.05;
    }

    .teams-mini tbody tr:last-child td{
      border-bottom: none;
    }

    .place-pill{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 56px;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0.10);
      background: #ffffff;
      font-weight: 900;
      color: rgba(0,0,0,0.70);
    }

    .team-cell{
      font-weight: 900;
      color: #0b1220;
    }

    .team-muted{
      color: rgba(0,0,0,0.55);
      font-weight: 900;
      white-space: nowrap;
    }

    /* --- MOBILE FIXES (PUT THIS AT THE VERY BOTTOM) --- */
    @media (max-width: 700px) {
      .navbar {
        height: auto;
        padding: 12px 14px;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: wrap;
        overflow: visible;
      }

      .nav-left {
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .nav-right {
        width: 100%;
        justify-content: flex-start;
        margin-top: 6px;
      }

      .logo-img {
        height: 56px;
        margin-top: 0;
      }

      .nav-btn,
      .contact-btn {
        padding: 8px 12px;
        border-radius: 16px;
        font-size: 14px;
      }

      .hero {
        padding: 26px 14px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .hero p.lead {
        font-size: 16px;
      }

      .live-card {
        padding: 16px;
        border-radius: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- NAV BAR (same as index.html) -->
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="logo.png" alt="Logo" class="logo-img" />
      </a>

      <a href="index.html" class="nav-btn">HOME</a>
      <a href="contact.html" class="contact-btn">ABOUT</a>
      <a href="rules.html" class="nav-btn">RULES</a>
      <a href="liveevent.html" class="nav-btn live-event">LIVE EVENT</a>
    </div>
  </div>

  <!-- HERO BACKGROUND + LIVE EVENT CONTENT -->
  <div class="hero">
    <div class="hero-content">
      <h1>LIVE EVENT</h1>

      <div class="live-card">
        <!-- Tabs -->
        <div class="tabs" role="tablist" aria-label="Live Event Tabs">
          <button class="tab-btn active" id="tabPools" type="button">Pools</button>

          <!-- ✅ WHEN READY TO SHOW PLAYOFFS: uncomment the next line Bitch -->
          <a class="tab-btn" id="tabPlayoffs" href="playoff.html">Playoffs</a>
        </div>

        <!-- Pools Panel -->
        <div id="panelPools">
          <div class="section-head">
            <div>
              <h2 class="section-title">Pools</h2>
            </div>

            <div class="toggle" aria-label="Tournament Toggle">
              <button class="toggle-btn active" id="btnMen" type="button">Reverse Coed</button>
              <button class="toggle-btn" id="btnWomen" type="button"></button>
            </div>
          </div>

          <div class="grid" id="poolGrid">
            <!-- Cards injected by JS -->
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ===========================
    // PUT YOUR REAL VALUES HERE
    // ===========================
    // Use the SAME WEB_APP_URL you already use in pool.html
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwYxZH7UAUUd96KhxPqvMf6XCEYc5s0_2hkVQcZs74bCar53vWDrNQ35_E5NtTL40ORuA/exec";

    // ====== STATE ======
    let tournament = "men";

    // ====== ELEMENTS ======
    const btnMen = document.getElementById("btnMen");
    const btnWomen = document.getElementById("btnWomen");
    const poolGrid = document.getElementById("poolGrid");

    // ====== HELPERS ======
    async function fetchJSON(url) {
      const res = await fetch(url);
      return await res.json();
    }

    function escapeHTML(str) {
      return String(str || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    // Accepts "women" or "womens"
    function normalizeTournamentKey(t) {
      const x = String(t || "").trim().toLowerCase();
      return (x === "women") ? "women" : "men";
    }

    function labelTournament(t) {
      return t === "women" ? "Women" : "Men";
    }

    // Backend: returns only pools that exist
    async function fetchPoolsList(tKey) {
      const url = `${WEB_APP_URL}?action=getPoolsList&tournament=${encodeURIComponent(tKey)}&ts=${Date.now()}`;
      const data = await fetchJSON(url);
      if (!data || !data.ok) throw new Error((data && data.error) ? data.error : "getPoolsList failed");
      return data.pools || [];
    }

    // Load teams for one pool (for preview table)
    async function fetchPoolTeams(tKey, poolNo) {
      const url = `${WEB_APP_URL}?action=getPool&tournament=${encodeURIComponent(tKey)}&pool=${encodeURIComponent(poolNo)}&ts=${Date.now()}`;
      const data = await fetchJSON(url);
      if (!data || !data.ok) throw new Error((data && data.error) ? data.error : "getPool failed");
      return data.teams || [];
    }

    // ====== RENDER POOLS ======
    async function renderPools() {
      poolGrid.innerHTML = `<div class="pool-desc">Loading pools…</div>`;

      const tKey = normalizeTournamentKey(tournament);
      const tLabel = labelTournament(tKey);

      try {
        const pools = await fetchPoolsList(tKey);

        poolGrid.innerHTML = "";

        if (!pools.length) {
          poolGrid.innerHTML = `
            <div class="pool-card">
              <div class="pool-top">
                <h3 class="pool-name">No pools yet</h3>
                <span class="pill">${tLabel}</span>
              </div>
              <p class="pool-desc">No pools found for this tournament.</p>
            </div>
          `;
          return;
        }

        pools.forEach(p => {
          const poolNo = p.pool;

          const card = document.createElement("div");
          card.className = "pool-card";

          const href = `pool.html?tournament=${encodeURIComponent(tKey)}&pool=${encodeURIComponent(poolNo)}`;
          const tbodyId = `teamsBody_${tKey}_${poolNo}`.replace(/[^a-z0-9_]/gi, "_");

          card.innerHTML = `
            <div class="pool-top">
              <h3 class="pool-name">Pool ${poolNo}</h3>
              <span class="pill">${tLabel} • Pool ${poolNo}</span>

              <table class="teams-mini" aria-label="Pool teams preview">
                <thead>
                  <tr>
                    <th style="width:110px;">Place</th>
                    <th>Team</th>
                  </tr>
                </thead>
                <tbody id="${tbodyId}">
                  <tr>
                    <td><span class="place-pill">—</span></td>
                    <td class="team-cell team-muted">Loading…</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <a class="pool-btn" href="${href}">Go to Pool</a>
          `;

          poolGrid.appendChild(card);

          fetchPoolTeams(tKey, poolNo)
            .then((teams) => {
              const tbody = document.getElementById(tbodyId);
              if (!tbody) return;

              if (!teams.length) {
                tbody.innerHTML = `
                  <tr>
                    <td><span class="place-pill">—</span></td>
                    <td class="team-cell team-muted">No teams yet</td>
                  </tr>
                `;
                return;
              }

              tbody.innerHTML = teams.map((name, idx) => `
                <tr>
                  <td><span class="place-pill">${idx + 1}</span></td>
                  <td class="team-cell">${escapeHTML(name)}</td>
                </tr>
              `).join("");
            })
            .catch(() => {
              const tbody = document.getElementById(tbodyId);
              if (tbody) {
                tbody.innerHTML = `
                  <tr>
                    <td><span class="place-pill">—</span></td>
                    <td class="team-cell team-muted">Couldn’t load teams</td>
                  </tr>
                `;
              }
            });
        });

      } catch (err) {
        poolGrid.innerHTML = `
          <div class="pool-card">
            <div class="pool-top">
              <h3 class="pool-name">Couldn’t load pools</h3>
              <span class="pill">${tLabel}</span>
            </div>
            <p class="pool-desc">
              ${err && err.message ? err.message : "Unknown error"}
            </p>
          </div>
        `;
      }
    }

    // ====== TOURNAMENT TOGGLE ======
    async function setTournament(next) {
      tournament = next;
      btnMen.classList.toggle("active", tournament === "men");
      btnWomen.classList.toggle("active", tournament === "women");
      await renderPools();
    }

    btnMen.addEventListener("click", () => setTournament("men"));
    btnWomen.addEventListener("click", () => setTournament("women"));

    // ====== INIT ======
    setTournament("men");
  </script>
</body>
</html>
