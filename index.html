<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>530Volleyball</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* NAV BAR (LOCKED HEIGHT) */
    .navbar {
      background: #040d6e;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      overflow: visible;
    }

    .nav-left,
    .nav-right {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* LOGO IMAGE */
    .logo-img {
      height: 100px;
      width: auto;
      display: block;
      margin-top: 15px;
    }

    /* NAV BUTTON STYLE */
    .nav-btn,
    .contact-btn {
      background: rgba(255,255,255,0.18);
      padding: 10px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .nav-btn:hover,
    .contact-btn:hover {
      background: rgba(255,255,255,0.28);
    }

    .nav-btn.live-event {
      border: 4px solid #ff2d55;
      background: rgba(255,255,255,0.18);
      animation: livePulse 1.2s infinite;
    }

    .nav-btn.live-event:hover {
      background: rgba(255,255,255,0.26);
      animation: none;
      box-shadow: 0 0 0 4px rgba(255,45,85,0.18);
    }

    @keyframes livePulse {
      0% {
        border-color: rgba(255,45,85,0.25);
        box-shadow: 0 0 0 0 rgba(255,45,85,0.00);
      }
      50% {
        border-color: rgba(255,45,85,1);
        box-shadow: 0 0 0 6px rgba(255,45,85,0.22);
      }
      100% {
        border-color: rgba(255,45,85,0.25);
        box-shadow: 0 0 0 0 rgba(255,45,85,0.00);
      }
    }



    /* HERO */
    .hero {
      height: calc(100vh - 100px);  /* matches navbar height (100px) */
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("hero.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .hero-content {
      max-width: 900px;
      transform: translateY(-60px); /* move up */
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .hero p {
      font-size: 22px;
      line-height: 1.5;
      opacity: 0.95;
    }

    /* BIG VIEW EVENTS BUTTON */
    .hero-btn {
      margin-top: 34px;
      padding: 23px 62px;
      font-size: 24px;
      background: red;
      color: white;
      border: 2px solid transparent;
      border-radius: 40px;
      cursor: pointer;
      font-weight: bold;

      transition: border-color 220ms ease, transform 220ms ease, box-shadow 220ms ease;
    }

    .hero-btn:hover {
      background: darkred;
      border-color: rgba(31, 53, 86, 0.55);
    }

    /* --- MOBILE FIXES (PUT THIS AT THE VERY BOTTOM) --- */
    @media (max-width: 700px) {
      .navbar {
        height: auto;
        padding: 12px 14px;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: wrap;
        overflow: visible;
      }

      .nav-left {
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .nav-right {
        width: 100%;
        justify-content: flex-start;
        margin-top: 6px;
      }

      .logo-img {
        height: 56px;
        margin-top: 0;
      }

      .nav-btn,
      .contact-btn {
        padding: 8px 12px;
        border-radius: 16px;
        font-size: 14px;
      }

      /* optional: give the hero a little more breathing room on phones */
      .hero {
        height: auto;
        min-height: calc(100vh - 100px);
        padding: 30px 18px;
      }

      .hero h1 {
        font-size: 28px;
      }

      .hero p {
        font-size: 18px;
      }

      .hero-btn {
        padding: 16px 36px;
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- NAV BAR -->
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="logo.png" alt="Logo" class="logo-img" />
      </a>

      <a href="index.html" class="nav-btn">HOME</a>
      <a href="contact.html" class="contact-btn">ABOUT</a>
      <a href="rules.html" class="nav-btn">RULES</a>
      <!--<a href="liveevent.html" class="nav-btn live-event">LIVE EVENT</a>-->
      <!--Bitch-->
    </div>


  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-content">
      <h1>WELCOME TO 530VOLLEYBALL!</h1>
      <p>
        We host fun, competitive grass and sand volleyball tournaments in Redding, CA,
        bringing players together for great matches,
        good vibes, and unforgettable weekends.
      </p>

      <button class="hero-btn" onclick="location.href='events.html'">
        VIEW EVENTS
      </button>
    </div>
  </div>

</body>
</html>
