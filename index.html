<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volleyball Association</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
    }

    /* NAV BAR */
    .navbar {
      background: #87CEEB;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
    }

    .nav-left,
    .nav-right {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* LOGO IMAGE (2x bigger) */
    .logo-img {
      height: 88px;
      width: auto;
      display: block;
    }

    /* NAV BUTTON STYLE (EVENTS + CONTACT) */
    .nav-btn,
    .contact-btn {
      background: rgba(255,255,255,0.18);
      padding: 10px 16px;
      border-radius: 20px;
    }

    .nav-btn:hover,
    .contact-btn:hover {
      background: rgba(255,255,255,0.28);
    }

    /* HERO */
    .hero {
      height: calc(100vh - 80px);
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("hero.jpg") center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }

    .hero-content {
      max-width: 900px;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    .hero p {
      font-size: 22px;
      line-height: 1.5;
      opacity: 0.95;
    }

    /* BIG VIEW EVENTS BUTTON */
    .hero-btn {
      margin-top: 34px;
      padding: 20px 54px;
      font-size: 22px;
      background: white;
      color: #1f3556;
      border: none;
      border-radius: 40px;
      cursor: pointer;
      font-weight: bold;
    }

    .hero-btn:hover {
      background: #f0f0f0;
    }
  </style>
</head>

<body>

  <!-- NAV BAR -->
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="logo.png" alt="Logo" class="logo-img" />
      </a>

      <a href="events.html" class="nav-btn">EVENTS</a>
    </div>

    <div class="nav-right">
      <a href="contact.html" class="contact-btn">CONTACT INFO</a>
    </div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-content">
      <h1>WHAT IS UP EMMA BRUH</h1>
      <p>
        Founded to bring together athletes of all skill levels,
        our volleyball community hosts high-quality events,
        leagues, and tournaments across the state.
      </p>

      <button class="hero-btn" onclick="location.href='events.html'">
        VIEW EVENTS
      </button>
    </div>
  </div>

</body>
</html>
