<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volleyball</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e90ff, #00c6ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(0,0,0,0.2);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    img {
      max-width: 250px;
      margin-bottom: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .btn {
      padding: 14px 30px;
      font-size: 18px;
      background: white;
      color: #1e90ff;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
    }

    .btn:hover {
      background: #f0f0f0;
    }
  </style>
</head>

<body>
  <div class="container">
    <img src="centerimage.png" alt="Volleyball" />
    <h1>Welcome to the Volleyball Page</h1>

    <a href="events.html" class="btn">EVENTS</a>
  </div>
</body>
</html>
