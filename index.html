<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #007bff, #00c6ff);
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      color: #666;
      margin-bottom: 30px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .info-box {
      background: #f4f6f8;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .info-box h3 {
      margin-bottom: 8px;
    }

    .register-btn {
      display: block;
      width: 100%;
      padding: 15px;
      font-size: 18px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }

    .register-btn:hover {
      background: #0056b3;
    }

    form {
      display: none;
      margin-top: 30px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
    }

    button.submit-btn {
      background: #28a745;
      color: white;
      border: none;
      margin-top: 16px;
      padding: 14px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    button.submit-btn:hover {
      background: #1e7e34;
    }
  </style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>🔥 Community Event Registration</h1>
    <p class="subtitle">
      Join us for an exclusive event focused on learning, networking, and growth.
    </p>

    <div class="info">
      <div class="info-box">
        <h3>📅 Date</h3>
        <p>March 15, 2026</p>
      </div>
      <div class="info-box">
        <h3>📍 Location</h3>
        <p>Redding, CA</p>
      </div>
      <div class="info-box">
        <h3>🎯 Who It's For</h3>
        <p>Beginners & Professionals</p>
      </div>
    </div>

    <button class="register-btn" onclick="showForm()">
      Register Now
    </button>

    <form id="regForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <h2 style="text-align:center; margin-bottom:10px;">Secure Your Spot</h2>

      <input type="text" name="name" placeholder="Full Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <input type="text" name="company" placeholder="Company (optional)" />

      <button type="submit" class="submit-btn">
        Submit Registration
      </button>
    </form>
  </div>
</div>

<script>
  function showForm() {
    document.getElementById("regForm").style.display = "block";
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }
</script>

</body>
</html>
