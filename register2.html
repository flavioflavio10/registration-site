<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register Doubles Team</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #333;
    }

    /* NAV BAR (LOCKED HEIGHT) */
    .navbar {
      background: #040d6e;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      overflow: visible;
    }

    .nav-left,
    .nav-right {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* LOGO IMAGE */
    .logo-img {
      height: 100px;
      width: auto;
      display: block;
      margin-top: 15px;
    }

    /* NAV BUTTON STYLE */
    .nav-btn,
    .contact-btn {
      background: rgba(255,255,255,0.18);
      padding: 10px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .nav-btn:hover,
    .contact-btn:hover {
      background: rgba(255,255,255,0.28);
    }

    /* HERO BACKGROUND (same as events.html) */
    .hero {
      min-height: calc(100vh - 100px); /* match navbar height */
      background:
        linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
        url("hero.jpg") center/cover no-repeat;
      padding: 40px 20px;
    }

    /* PAGE CONTENT WRAP (on top of hero background) */
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 34px 20px;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
    }

    /* ✅ Your form wrap (UPDATED: force perfect centering) */
    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 18px;

      display: flex;               /* ✅ add */
      justify-content: center;     /* ✅ add */
    }

    /* ✅ Form card (DARK like your other page) */
    .card {
      background: rgba(0,0,0,0.75);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
    }

    /* ✅ Make text readable on dark card */
    h1 { margin: 0 0 14px; color: white; }
    h2 { margin: 22px 0 10px; font-size: 18px; color: white; }
    label { font-weight: 600; font-size: 14px; color: rgba(255,255,255,0.92); }
    .note { font-size: 13px; color: rgba(255,255,255,0.70); margin-top: 10px; }

    .row { display:flex; gap: 14px; flex-wrap: wrap; }
    .field { flex: 1 1 240px; display:flex; flex-direction: column; gap: 6px; margin: 10px 0; }

    /* ✅ Inputs readable on dark card */
    input[type="text"], input[type="email"], input[type="tel"] {
      padding: 12px 12px;
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 10px;
      font-size: 15px;
      background: rgba(255,255,255,0.10);
      color: white;
      outline: none;
    }

    input[type="text"]::placeholder,
    input[type="email"]::placeholder,
    input[type="tel"]::placeholder {
      color: rgba(255,255,255,0.60);
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus {
      border-color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.14);
    }

    .checks { display:flex; gap:18px; align-items:center; margin: 8px 0 0; flex-wrap: wrap; }
    .checks label { font-weight: 600; }

    .terms { margin-top: 14px; display:flex; gap:10px; align-items:flex-start; }
    .terms a { color:#7fb2ff; text-decoration:none; }
    .terms a:hover { text-decoration: underline; }

    .btn {
      margin-top: 18px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      background: red;
      color: #fff;
      border:none;
      border-radius: 12px;
      cursor:pointer;
      width: 100%;
    }
    .btn:disabled { opacity: 0.6; cursor:not-allowed; }

    .error { margin-top: 12px; color:#ff5a5f; font-weight: 700; }
    .success { margin-top: 12px; color:#3bff7a; font-weight: 700; }

    /* Stripe Payment Element container spacing */
    #paymentWrap { margin-top: 16px; }

    /* --- MOBILE FIXES (same spirit as events.html) --- */
    @media (max-width: 700px) {
      .navbar {
        height: auto;
        padding: 12px 14px;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: wrap;
        overflow: visible;
      }

      .nav-left {
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .nav-right {
        width: 100%;
        justify-content: flex-start;
        margin-top: 6px;
      }

      .logo-img {
        height: 56px;
        margin-top: 0;
      }

      .nav-btn,
      .contact-btn {
        padding: 8px 12px;
        border-radius: 16px;
        font-size: 14px;
      }

      .hero {
        min-height: auto;
        padding: 30px 14px;
      }

      .container {
        padding: 26px 16px;
      }

      /* ✅ UPDATED: remove extra wrap padding on phones */
      .wrap {
        padding: 0;                 /* ✅ add */
      }

      .card {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- NAV BAR (same as events.html) -->
  <div class="navbar">
    <div class="nav-left">
      <a href="index.html">
        <img src="logo.png" alt="Logo" class="logo-img" />
      </a>

      <a href="index.html" class="nav-btn">HOME</a>
      <a href="contact.html" class="contact-btn">ABOUT</a>
      <a href="rules.html" class="nav-btn">RULES</a>
    </div>
  </div>

  <!-- HERO BACKGROUND WRAP -->
  <div class="hero">
    <div class="container">
      <div class="wrap">
        <div class="card">
          <h1>Register Your Doubles Team</h1>

          <div class="field">
            <label>Tournament</label>
            <div class="checks">
              <label><input type="checkbox" id="divisionReverseCoed" /> Reverse Coed Doubles</label>
            </div>
            <div class="note">Select the format.</div>
          </div>

          <div class="field">
            <label for="teamName">Team Name</label>
            <input id="teamName" type="text" required />
          </div>

          <h2>Player 1 info</h2>
          <div class="row">
            <div class="field">
              <label for="p1First">First Name</label>
              <input id="p1First" type="text" required />
            </div>
            <div class="field">
              <label for="p1Last">Last Name</label>
              <input id="p1Last" type="text" required />
            </div>
            <div class="field">
              <label for="p1Phone">Phone Number</label>
              <input id="p1Phone" type="tel" required />
            </div>
            <div class="field">
              <label for="p1Email">Email</label>
              <input id="p1Email" type="email" required />
            </div>
          </div>

          <h2>Player 2 info</h2>
          <div class="row">
            <div class="field">
              <label for="p2First">First Name</label>
              <input id="p2First" type="text" required />
            </div>
            <div class="field">
              <label for="p2Last">Last Name</label>
              <input id="p2Last" type="text" required />
            </div>
            <div class="field">
              <label for="p2Phone">Phone Number</label>
              <input id="p2Phone" type="tel" required />
            </div>
            <div class="field">
              <label for="p2Email">Email</label>
              <input id="p2Email" type="email" required />
            </div>
          </div>

          <div class="terms">
            <input type="checkbox" id="agreeTerms" />
            <div>
              <label for="agreeTerms" style="font-weight:600;">
                I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a>
              </label>
            </div>
          </div>

          <!-- ✅ Stripe Payment Element container (hidden until we create the PaymentIntent) -->
          <div id="paymentWrap" style="display:none;">
            <div id="payment-element"></div>
          </div>

          <!-- ✅ Button now is a 2-step flow: Continue -> Pay -->
          <button class="btn" id="submitBtn">Continue to Payment</button>

          <div class="error" id="errorMsg" style="display:none;"></div>
          <div class="success" id="successMsg" style="display:none;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ✅ Stripe.js (must be loaded before your script that uses Stripe()) -->
  <script src="https://js.stripe.com/v3/"></script>

  <script>
    // ✅ Only one checkbox exists: Reverse Coed Doubles
    const reverseCoed = document.getElementById("divisionReverseCoed");

    // ✅ Your Apps Script Web App URL
    const scriptURL = "https://script.google.com/macros/s/AKfycbwYxZH7UAUUd96KhxPqvMf6XCEYc5s0_2hkVQcZs74bCar53vWDrNQ35_E5NtTL40ORuA/exec";

    // ✅ Stripe publishable key (SAFE to put in the browser)
    const STRIPE_PUBLISHABLE_KEY = "pk_live_51SthyzILimcUNTFxQPTOdYd4m6CPgVSjeV8aJKzwmEzCSp3cdbSCR3pGYwkf281lL4aX55jdMkwZ7e5HdxIVXs5600nBEjQG3l";

    // ✅ Your registered2.html URL on GitHub Pages
    const RETURN_URL = "http://www.530volleyball.com/registered2.html";

    const stripe = Stripe(STRIPE_PUBLISHABLE_KEY);

    const submitBtn = document.getElementById("submitBtn");
    const errorMsg = document.getElementById("errorMsg");
    const successMsg = document.getElementById("successMsg");
    const paymentWrap = document.getElementById("paymentWrap");

    const val = (id) => document.getElementById(id).value.trim();

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
      successMsg.style.display = "none";
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = "block";
      errorMsg.style.display = "none";
    }

    // Stripe Elements (initialized after we create a PaymentIntent)
    let elements = null;
    let registrationId = null;

    // Small helper to lock/unlock the form inputs after payment starts
    function setInputsDisabled(disabled) {
      const ids = [
        "divisionReverseCoed","teamName",
        "p1First","p1Last","p1Phone","p1Email",
        "p2First","p2Last","p2Phone","p2Email",
        "agreeTerms"
      ];
      for (const id of ids) {
        const el = document.getElementById(id);
        if (el) el.disabled = disabled;
      }
    }

    submitBtn.addEventListener("click", async () => {
      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      // ------------------------------------------------------------
      // STEP 2: If Payment Element is already mounted -> this click is "Pay"
      // ------------------------------------------------------------
      if (elements) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Processing...";

        const { error } = await stripe.confirmPayment({
          elements,
          confirmParams: {
            return_url: `${RETURN_URL}?registrationId=${encodeURIComponent(registrationId)}`
          }
        });

        if (error) {
          showError(error.message || "Payment failed. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Pay $50";
        }
        return;
      }

      // ------------------------------------------------------------
      // STEP 1: First click -> validate form, create PaymentIntent, mount Payment Element
      // ------------------------------------------------------------
      const division = reverseCoed.checked ? "Reverse Coed Doubles" : "";
      if (!division) return showError("Please select Reverse Coed Doubles.");
      if (!val("teamName")) return showError("Please enter a team name.");
      if (!document.getElementById("agreeTerms").checked) return showError("You must agree to the Terms & Conditions.");

      const requiredIds = ["p1First","p1Last","p1Phone","p1Email","p2First","p2Last","p2Phone","p2Email"];
      for (const id of requiredIds) {
        if (!val(id)) return showError("Please fill out all player fields.");
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Loading payment...";

      const payload = {
        division,
        teamName: val("teamName"),
        p1First: val("p1First"),
        p1Last: val("p1Last"),
        p1Phone: val("p1Phone"),
        p1Email: val("p1Email"),
        p2First: val("p2First"),
        p2Last: val("p2Last"),
        p2Phone: val("p2Phone"),
        p2Email: val("p2Email")
      };

      try {
        const res = await fetch(scriptURL, {
          method: "POST",
          mode: "cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "createIntent", payload })
        });

        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "createIntent failed");

        registrationId = data.registrationId;

        elements = stripe.elements({
          clientSecret: data.clientSecret,
          appearance: { theme: "night" }
        });

        const paymentElement = elements.create("payment");
        paymentElement.mount("#payment-element");

        paymentWrap.style.display = "block";
        setInputsDisabled(true);
        showSuccess("Payment loaded. Enter your payment info below.");

        submitBtn.disabled = false;
        submitBtn.textContent = "Pay $50";

      } catch (err) {
        console.error(err);
        showError("Could not start payment. Double-check your Stripe key, Apps Script deployment, and Script Properties.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Continue to Payment";
      }
    });
  </script>
</body>
</html>
