<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>530Volleyball | Scorekeeper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin:0; font-family: Arial, sans-serif; color:white; }

    .navbar {
      background: #040d6e;
      height: 100px;
      display:flex;
      align-items:center;
      justify-content: space-between;
      padding: 0 28px;
      overflow: visible;
    }

    .nav-left { display:flex; gap:18px; align-items:center; }
    .navbar a { color:white; text-decoration:none; font-weight:600; letter-spacing:0.5px; }

    .logo-img { height:100px; width:auto; display:block; margin-top:15px; }

    .nav-btn, .contact-btn {
      background: rgba(255,255,255,0.18);
      padding: 10px 16px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .nav-btn:hover, .contact-btn:hover { background: rgba(255,255,255,0.28); }

    .hero {
      min-height: calc(100vh - 100px);
      background:
        linear-gradient(rgba(0,0,0,0.50), rgba(0,0,0,0.50)),
        url("hero.jpg") center/cover no-repeat;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding: 40px 18px;
      box-sizing:border-box;
    }

    .hero-content { width:100%; max-width: 780px; }
    .hero h1 { font-size: 34px; margin: 0 0 10px; text-align:center; letter-spacing:1px; }
    .hero p.lead { font-size: 16px; line-height: 1.6; opacity:0.95; text-align:center; margin: 0 auto 20px; max-width: 720px; }

    :root{
      --border: rgba(0,0,0,0.12);
      --mutedDark: rgba(0,0,0,0.62);
      --shadow: 0 10px 30px rgba(0,0,0,0.18);
      --radius: 18px;
    }

    .card {
      background: #ffffff;
      color: #111827;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 22px;
      box-shadow: var(--shadow);
    }

    .top-row{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .pill{
      display:inline-block;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.12);
      color: rgba(0,0,0,0.62);
      background: rgba(0,0,0,0.03);
      white-space: nowrap;
    }

    .back-btn{
      border: 2px solid rgba(0,0,0,0.16);
      background: #ffffff;
      color: #0b1220;
      font-weight: 900;
      padding: 10px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
      text-decoration:none;
      display:inline-block;
    }

    .back-btn:hover { transform: translateY(-1px); background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.30); }

    .score-grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    .team-box{
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 16px;
      padding: 14px;
      background: rgba(0,0,0,0.02);
      text-align:center;
    }

    .team-name{
      font-weight: 900;
      font-size: 16px;
      margin-bottom: 8px;
      color: #0b1220;
    }

    .score-num{
      font-size: 46px;
      font-weight: 1000;
      letter-spacing: 1px;
      margin: 6px 0 10px;
      color: #0b1220;
    }

    .btn-row{
      display:flex;
      justify-content:center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .score-btn{
      width: 54px;
      height: 44px;
      border-radius: 12px;
      border: 2px solid rgba(0,0,0,0.16);
      background: #fff;
      font-weight: 1000;
      font-size: 18px;
      cursor:pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease;
    }

    .score-btn:hover{
      transform: translateY(-1px);
      background: rgba(0,0,0,0.03);
      border-color: rgba(0,0,0,0.30);
    }

    .bottom-row{
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .submit-btn{
      border: none;
      background: #0b1220;
      color: white;
      font-weight: 1000;
      padding: 12px 16px;
      border-radius: 999px;
      cursor:pointer;
    }

    .submit-btn:hover{ background:#050a14; }

    .status{
      color: rgba(0,0,0,0.65);
      font-weight: 800;
      font-size: 14px;
    }

    .error{
      background: rgba(255,0,0,0.08);
      border: 1px solid rgba(255,0,0,0.22);
      color: #7f1d1d;
      padding: 12px 14px;
      border-radius: 12px;
      margin-top: 12px;
      display:none;
    }

    @media (max-width: 700px){
      .navbar { height:auto; padding: 12px 14px; align-items:flex-start; gap:10px; flex-wrap:wrap; }
      .nav-left { flex-wrap: wrap; gap:10px; align-items:center; }
      .logo-img { height:56px; margin-top:0; }
      .nav-btn, .contact-btn { padding: 8px 12px; border-radius: 16px; font-size: 14px; }
      .hero { padding: 26px 14px; }
      .score-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="nav-left">
      <a href="index.html"><img src="logo.png" alt="Logo" class="logo-img" /></a>
      <a href="index.html" class="nav-btn">HOME</a>
      <a href="contact.html" class="contact-btn">ABOUT</a>
      <a href="rules.html" class="nav-btn">RULES</a>
      <a href="liveevent.html" class="nav-btn">LIVE EVENT</a>
    </div>
  </div>

  <div class="hero">
    <div class="hero-content">
      <h1>SCOREKEEPER</h1>
      <p class="lead" id="leadText">Loading match…</p>

      <div class="card">
        <div class="top-row">
          <span class="pill" id="matchPill">Match</span>
          <a class="back-btn" id="backLink" href="liveevent.html">← Back</a>
        </div>

        <div class="score-grid">
          <div class="team-box">
            <div class="team-name" id="teamAName">Team A</div>
            <div class="score-num" id="scoreA">0</div>
            <div class="btn-row">
              <button class="score-btn" id="aMinus" type="button">−</button>
              <button class="score-btn" id="aPlus" type="button">+</button>
            </div>
          </div>

          <div class="team-box">
            <div class="team-name" id="teamBName">Team B</div>
            <div class="score-num" id="scoreB">0</div>
            <div class="btn-row">
              <button class="score-btn" id="bMinus" type="button">−</button>
              <button class="score-btn" id="bPlus" type="button">+</button>
            </div>
          </div>
        </div>

        <div class="bottom-row">
          <div class="status" id="statusText">Tip: tap + / − while reffing.</div>
          <button class="submit-btn" id="submitBtn" type="button">Submit Score</button>
        </div>

        <div class="error" id="errorBox"></div>
      </div>
    </div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwYxZH7UAUUd96KhxPqvMf6XCEYc5s0_2hkVQcZs74bCar53vWDrNQ35_E5NtTL40ORuA/exec";

    const params = new URLSearchParams(window.location.search);
    const matchId = (params.get("matchId") || "").trim();

    const leadText = document.getElementById("leadText");
    const matchPill = document.getElementById("matchPill");
    const backLink = document.getElementById("backLink");

    const teamANameEl = document.getElementById("teamAName");
    const teamBNameEl = document.getElementById("teamBName");
    const scoreAEl = document.getElementById("scoreA");
    const scoreBEl = document.getElementById("scoreB");
    const statusText = document.getElementById("statusText");
    const errorBox = document.getElementById("errorBox");

    const submitBtn = document.getElementById("submitBtn");
    const aMinus = document.getElementById("aMinus");
    const aPlus = document.getElementById("aPlus");
    const bMinus = document.getElementById("bMinus");
    const bPlus = document.getElementById("bPlus");

    let match = null;
    let scoreA = 0;
    let scoreB = 0;

    function showError(msg){
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    function setScores(){
      scoreAEl.textContent = String(scoreA);
      scoreBEl.textContent = String(scoreB);
    }

    async function fetchJSON(url){
      const res = await fetch(url);
      return await res.json();
    }

    async function postJSON(url, data){
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      });
      return await res.json();
    }

    function clamp(n){ return Math.max(0, n); }

    async function loadMatch(){
      if(!matchId){
        showError("Missing matchId in URL. Example: score.html?matchId=MEN-P1-M1");
        leadText.textContent = "Missing matchId.";
        return;
      }

      // Get match info
      const matchURL = `${WEB_APP_URL}?action=getMatch&matchId=${encodeURIComponent(matchId)}`;
      const scoreURL = `${WEB_APP_URL}?action=getScore&matchId=${encodeURIComponent(matchId)}`;

      const matchResp = await fetchJSON(matchURL);
      if(!matchResp.ok){
        showError(matchResp.error || "Could not load match.");
        leadText.textContent = "Could not load match.";
        return;
      }

      match = matchResp.match;

      // Set UI
      matchPill.textContent = `${match.tournament.toUpperCase()} • Pool ${match.pool} • Match ${match.matchNo}`;
      leadText.textContent = `${match.teamA} vs ${match.teamB}`;
      teamANameEl.textContent = match.teamA;
      teamBNameEl.textContent = match.teamB;

      // Back link goes back to pool page
      backLink.href = `pool.html?tournament=${encodeURIComponent(match.tournament)}&pool=${encodeURIComponent(match.pool)}`;

      // Load existing score if it exists
      const scoreResp = await fetchJSON(scoreURL);
      if(scoreResp.ok && scoreResp.score){
        scoreA = Number(scoreResp.score.scoreA || 0);
        scoreB = Number(scoreResp.score.scoreB || 0);
        setScores();
        statusText.textContent = "Loaded saved score.";
      } else {
        setScores();
      }
    }

    aPlus.addEventListener("click", () => { scoreA++; setScores(); });
    aMinus.addEventListener("click", () => { scoreA = clamp(scoreA - 1); setScores(); });
    bPlus.addEventListener("click", () => { scoreB++; setScores(); });
    bMinus.addEventListener("click", () => { scoreB = clamp(scoreB - 1); setScores(); });

    submitBtn.addEventListener("click", async () => {
      if(!match) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving…";
      statusText.textContent = "Saving score…";

      const payload = {
        action: "saveScore",
        payload: {
          matchId: match.matchId,
          tournament: match.tournament,
          pool: match.pool,
          matchNo: match.matchNo,
          teamA: match.teamA,
          teamB: match.teamB,
          scoreA: scoreA,
          scoreB: scoreB
        }
      };

      try{
        const resp = await postJSON(WEB_APP_URL, payload);
        if(!resp.ok){
          showError(resp.error || "Could not save score.");
          statusText.textContent = "Save failed.";
        } else {
          statusText.textContent = `Saved. Winner: ${resp.winner}`;
          // go back after a short moment
          setTimeout(() => { window.location.href = backLink.href; }, 650);
        }
      } catch(e){
        showError("Could not reach backend while saving. Check deployment.");
        statusText.textContent = "Save failed.";
      } finally{
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Score";
      }
    });

    loadMatch();
  </script>
</body>
</html>
